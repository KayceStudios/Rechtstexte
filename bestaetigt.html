  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: linear-gradient(180deg,#6E2CA8,#9B1E8C,#C51A6B,#DE2F45,#EC5A1C,#F98D08);

    display: flex; align-items: center; justify-content: center;
    padding: 28px 20px;
    overflow: hidden;
  }

  /* Sternenhimmel — dieselben Positionen wie in der App. */
  .sky { position: fixed; inset: 0; pointer-events: none; }
  .sky i, .sky b {
    position: absolute; display: block;
    opacity: var(--o);
    animation: blink 3s ease-in-out infinite alternate;
  }
  .sky i { background: #fff; border-radius: 50%; box-shadow: 0 0 6px rgba(255,255,255,0.8); }
  .sky b {
    background: #fff;
    clip-path: polygon(50% 0%, 56% 44%, 100% 50%, 56% 56%, 50% 100%, 44% 56%, 0% 50%, 44% 44%);
  }
  @keyframes blink { from { opacity: calc(var(--o) * 0.2); } to { opacity: var(--o); } }

  .box { position: relative; text-align: center; max-width: 420px; width: 100%; }

  .logo { width: 224px; max-width: 62%; height: auto; margin: 0 auto 30px; display: block; }

  .tick {
    width: 82px; height: 82px; margin: 0 auto 22px;
    border-radius: 50%;
    background: rgba(255,255,255,0.14);
    border: 2px solid rgba(255,255,255,0.55);
    backdrop-filter: blur(6px);
    display: flex; align-items: center; justify-content: center;
    font-size: 40px; line-height: 1;
    animation: pop 0.5s cubic-bezier(0.2, 0.9, 0.3, 1.2) both;
  }
  @keyframes pop { from { transform: scale(0.6); opacity: 0; } to { transform: scale(1); opacity: 1; } }

  h1 { font-size: 27px; font-weight: 800; margin: 0 0 10px; letter-spacing: -0.4px;
       text-shadow: 0 2px 14px rgba(0,0,0,0.25); }
  p  { margin: 0; font-size: 16px; color: rgba(255,255,255,0.92); text-shadow: 0 1px 8px rgba(0,0,0,0.2); }

  .card {
    margin-top: 26px;
    background: rgba(255,255,255,0.12);
    border: 1px solid rgba(255,255,255,0.24);
    border-radius: 18px;
    padding: 18px 20px;
    text-align: left;
    backdrop-filter: blur(8px);
  }
  .card ol { margin: 0; padding-left: 20px; }
  .card li { margin-bottom: 7px; font-size: 15px; }
  .card li:last-child { margin-bottom: 0; }

  footer { position: fixed; left: 0; right: 0; bottom: 16px; text-align: center;
           font-size: 12.5px; color: rgba(255,255,255,0.7); }
  footer a { color: rgba(255,255,255,0.9); }

  @media (max-width: 380px) { h1 { font-size: 23px; } .logo { margin-bottom: 22px; } }
