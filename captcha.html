<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sicherheitsprüfung — Party!</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: transparent;
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, sans-serif;
    color: #e9dcf2;
  }
  .wrap { height: 100%; display: flex; align-items: center; justify-content: center; }
  .hint { opacity: 0.75; font-size: 13.5px; text-align: center; padding: 0 16px; }
</style>
<script src="https://challenges.cloudflare.com/turnstile/v0/api.js?onload=onTurnstileLoad" async defer></script>
</head>
<body>

<!--
  Diese Seite steckt in der App „Party!" in einem kleinen Fenster (WebView).
  Cloudflare Turnstile prüft hier, dass ein Mensch am Gerät sitzt, und gibt
  einen Nachweis zurück. Den schickt die App beim Registrieren und Anmelden
  an Supabase mit. Der Schlüssel kommt als ?k= aus der App (er ist öffentlich).
-->

<div class="wrap"><div id="widget"></div></div>

<script>
  var params = new URLSearchParams(location.search);

  function send(message) {
    if (window.ReactNativeWebView) window.ReactNativeWebView.postMessage(JSON.stringify(message));
  }

  function onTurnstileLoad() {
    var key = params.get('k');
    if (!key) {
      document.getElementById('widget').innerHTML = '<p class="hint">Kein Schlüssel hinterlegt.</p>';
      send({ type: 'error', reason: 'nokey' });
      return;
    }

    turnstile.render('#widget', {
      sitekey: key,
      theme: params.get('theme') || 'dark',
      language: 'de',
      callback: function (token) {
        send({ type: 'token', token: token });
      },
      'error-callback': function () {
        send({ type: 'error' });
      },
      'expired-callback': function () {
        send({ type: 'expired' });
      },
      'timeout-callback': function () {
        send({ type: 'expired' });
      },
    });
  }

  window.onTurnstileLoad = onTurnstileLoad;
</script>

</body>
</html>
